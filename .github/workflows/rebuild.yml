name: Rebuild

on:
  schedule:
    - cron: "0 2 * * 6" # Saturday 02:00 UTC
  workflow_dispatch:

# One publish at a time. A new trigger replaces a pending run.
# Do not cancel the running job: revancedbot run + commit is not restart-safe.
concurrency:
  group: fdroid-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.54.2@sha256:8da772c56e5b64937a48447e988d1d42319809dd562098b0d08ee3c0f259d619
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y aapt apksigner

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Wait for Browserless
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/active && exit 0
            sleep 2
          done
          echo "browserless did not become ready" >&2
          exit 1

      - name: Rebuild
        env:
          REVANCEDBOT_SIGNING: ${{ secrets.REVANCEDBOT_SIGNING }}
          REVANCEDBOT_CDP_URL: ws://localhost:3000
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: revancedbot run fdroid

      - name: Publish tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fdroid/repo
          if [ -d fdroid/metadata ]; then
            git add fdroid/metadata
          fi
          if git diff --staged --quiet; then
            echo "no tree changes"
            exit 0
          fi
          git commit -m "chore: publish F-Droid tree"
          git push
